name: Read-only recovery of previously published Gather release
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
  actions: read
concurrency:
  group: events-read-only-recovery
  cancel-in-progress: false
jobs:
  recover-verified-receipt:
    if: github.repository == 'kasstmaster/events' && github.event.pull_request.head.repo.full_name == 'kasstmaster/events' && github.event.pull_request.head.ref == 'fix/gather-trusted-release-recovery'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out previously reviewed verifier, not proposed PR changes
        uses: actions/checkout@v5
        with:
          ref: d8e73b5089971644ea2c605b08631b0d5adfc363
          path: operations
          fetch-depth: 0
          persist-credentials: false
      - name: Check out exact owner-merged Worker release
        uses: actions/checkout@v5
        with:
          ref: eae56be72e1936d0a96d7411e1d3ef758c236b5d
          path: release
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: operations/package-lock.json
      - name: Install verifier dependencies
        run: npm ci --prefix operations
      - name: Retrieve original failed-run checkpoint and deployment receipt
        uses: actions/download-artifact@v7
        with:
          artifact-ids: "15238140278"
          merge-multiple: true
          repository: kasstmaster/events
          run-id: "46081547044"
          github-token: ${{ github.token }}
          path: release/recovery
      - name: Read-only verify exact already-published Worker without any deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACTIONS_GITHUB_TOKEN: ${{ github.token }}
          MERGED_SHA: eae56be72e1936d0a96d7411e1d3ef758c236b5d
        run: |
          node --input-type=module <<'NODE'
          import { run } from "./operations/scripts/automatic-events-release.mjs";
          const expected = "eae56be72e1936d0a96d7411e1d3ef758c236b5d";
          const response = await fetch(
            "https://api.github.com/repos/kasstmaster/events/pulls/114",
            { headers: {
                Authorization: "Bearer " + process.env.ACTIONS_GITHUB_TOKEN,
                Accept: "application/vnd.github+json",
                "X-GitHub-Api-Version": "2022-11-28"
              }, redirect: "error" },
          );
          if (!response.ok) throw new Error("Owner merge metadata unavailable");
          const pr = await response.json();
          if (
            !pr.merged ||
            pr.merge_commit_sha !== expected ||
            pr.merged_by?.login !== "kasstmaster" ||
            pr.base?.ref !== "main" ||
            pr.head?.repo?.full_name !== "kasstmaster/events"
          ) throw new Error("Prior merged release identity did not verify");
          try {
            // The verified historical owner merge supplies the event information
            // for a VERIFICATION-ONLY operation. The implementation cannot publish.
            await run("verify", {
              root: "release",
              event: { action: "closed", pull_request: pr },
            });
            console.log("PASS: prior published release fully reverified without publishing");
          } catch (error) {
            console.error("READ_ONLY_RECOVERY_FAILED", error.stage || "verification",
              error.message || "verification refused");
            process.exitCode = 1;
          }
          NODE
      - name: Upload independently reverified release record (not automatically trusted)
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: events-read-only-reverification-${{ github.run_id }}-${{ github.run_attempt }}
          path: release/recovery/events-verification.json
          if-no-files-found: error
          retention-days: 29
