name: Deploy events manually

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Read-only Cloudflare authentication diagnosis
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const token = process.env.CF_TOKEN || "";
          console.log(JSON.stringify({
            check: "credential_format",
            present: Boolean(token),
            has_outer_whitespace: token !== token.trim(),
            has_bearer_prefix: /^Bearer\s/i.test(token),
            contains_curl_command: /curl\s|Authorization:/.test(token),
            has_control_characters: /[\u0000-\u001f\u007f]/.test(token),
            looks_like_token_id: /^[a-f0-9]{32}$/i.test(token)
          }));
          const account = "37d068144865a0b725ee272bc7b2eb71";
          const expectedTokenId = "30d134b4258b956756af20aa2b3621bb";
          const checks = [
            ["account_token_verify", "/accounts/" + account + "/tokens/verify"],
            ["worker_settings", "/accounts/" + account + "/workers/scripts/events/settings"],
            ["worker_deployments", "/accounts/" + account + "/workers/scripts/events/deployments"],
            ["sqlite_namespace_inventory", "/accounts/" + account + "/workers/durable_objects/namespaces?per_page=100"],
            ["existing_namespace_objects", "/accounts/" + account + "/workers/durable_objects/namespaces/8203f4cd7fde45d2ab49de62e239d744/objects?limit=1"]
          ];
          for (const [check, path] of checks) {
            try {
              const response = await fetch("https://api.cloudflare.com/client/v4" + path, {
                method: "GET",
                headers: { Authorization: "Bearer " + token },
                signal: AbortSignal.timeout(15000)
              });
              const data = await response.json();
              const codes = Array.isArray(data.errors)
                ? data.errors.map(e => e.code).filter(Number.isFinite) : [];
              const result = { check, http: response.status, success: data.success === true, codes };
              if (check === "account_token_verify" && data.success === true) {
                result.matches_expected_token = data.result?.id === expectedTokenId;
                result.not_before = data.result?.not_before || null;
                result.expires_on = data.result?.expires_on || null;
                result.checked_at = new Date().toISOString();
                result.starts_in_future = Date.parse(data.result?.not_before) > Date.now();
                result.already_expired = Date.parse(data.result?.expires_on) <= Date.now();
                if (["active", "disabled", "expired"].includes(data.result?.status)) result.token_status = data.result.status;
              }
              console.log(JSON.stringify(result));
            } catch {
              console.log(JSON.stringify({ check, outcome: "transport_or_parse_failure" }));
            }
          }
          console.log("Read-only diagnosis complete. No deployments or configuration writes were attempted.");
          NODE
