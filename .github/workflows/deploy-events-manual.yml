name: Deploy events manually

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: events-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out the exact approved release
        uses: actions/checkout@v4
        with:
          ref: 5c024bf79727d79894a21184cdaa248e595f66b2
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Record current deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 37d068144865a0b725ee272bc7b2eb71
        run: npx wrangler deployments list --name events --config wrangler.jsonc

      - name: Deploy approved events release
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 37d068144865a0b725ee272bc7b2eb71
        run: npx wrangler deploy --name events --config wrangler.jsonc

      - name: Verify administrator setup stays closed
        run: |
          node --input-type=module <<'NODE'
          const response = await fetch(
            "https://events.kassandraraudman.workers.dev/api/setup"
          );
          if (!response.ok) throw new Error("Setup check failed");
          const result = await response.json();
          if (result.required !== false || result.enabled !== false) {
            throw new Error("Administrator setup is not closed");
          }
          console.log("Administrator setup remains closed.");
          NODE
