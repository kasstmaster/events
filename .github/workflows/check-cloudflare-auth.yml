name: Check Cloudflare authentication (read only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-cloudflare-auth:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Check Events metadata access without exposing runtime settings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/cloudflare-metadata-check.mjs
