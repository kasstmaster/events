name: Focused Gather navigation regression (temporary)
on:
  push:
    branches: [perf/fast-gather-startup-20261127]
permissions:
  contents: read
jobs:
  navigation:
    if: github.repository == 'kasstmaster/events' && github.ref == 'refs/heads/perf/fast-gather-startup-20261127'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node test/navigation-mobile.js
