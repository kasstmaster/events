name: Draft formatting diagnostics
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  format-diff:
    if: github.event.pull_request.draft == true
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Print exact Prettier diffs (read-only)
        run: |
          npx prettier --write server/handler.js server/initial-home.js test/initial-home.test.js test/startup-mobile.js
          git diff --unified=1 -- server/handler.js server/initial-home.js test/initial-home.test.js test/startup-mobile.js
