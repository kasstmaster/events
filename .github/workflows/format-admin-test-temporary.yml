name: Format administrator Home browser regression (temporary)
on:
  push:
    branches: [fix/admin-home-overflow-test]
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'kasstmaster/events' && github.ref == 'refs/heads/fix/admin-home-overflow-test'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci
      - run: npx prettier --write test/toolbar-mobile.js
      - name: Commit formatting to feature branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- test/toolbar-mobile.js
          if ! git diff --cached --quiet; then
            git commit -m "Format administrator overflow browser regression"
            git push origin HEAD:fix/admin-home-overflow-test
          fi
