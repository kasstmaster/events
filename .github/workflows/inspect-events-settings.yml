name: Inspect Events runtime settings (read only)

on:
  workflow_dispatch:
    inputs:
      recovery_run_id:
        description: Events deployment run containing the checkpoint
        required: true
        default: "41914053645"
      recovery_attempt:
        description: Checkpoint attempt
        required: true
        default: "1"

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/download-artifact@v7
        with:
          name: events-recovery-${{ inputs.recovery_run_id }}-${{ inputs.recovery_attempt }}
          path: recovery
          repository: kasstmaster/events
          run-id: ${{ inputs.recovery_run_id }}
          github-token: ${{ github.token }}
      - name: Compare safe runtime snapshots without changing settings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/manual-events-release.mjs inspect
      - uses: actions/upload-artifact@v6
        with:
          name: events-settings-inspection-${{ github.run_id }}-${{ github.run_attempt }}
          path: recovery/events-checkpoint-inspection.json
          if-no-files-found: error
          retention-days: 29
