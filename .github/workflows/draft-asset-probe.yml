name: Draft release provenance read-only probe
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  live-asset-probe:
    if: github.event.pull_request.draft == true
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Compare all currently deployed reviewed public assets, without writes
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from "node:child_process";
          import { approvedManifest, verifyAssetBytes } from "./scripts/application-provenance.mjs";
          const prior = "05f10df609eaa671ce835942e717e9618dcdc06c";
          const reviewedIndex = execFileSync("git", ["show", prior + ":public/index.html"]);
          const manifest = approvedManifest(prior);
          await verifyAssetBytes(manifest, fetch, { reviewedIndex });
          console.log("PASS: every prior-release asset matches across both live origins using the verified static sign-in shell");
          NODE
