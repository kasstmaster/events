name: One-time owner-approved Worker recovery
on:
  pull_request:
    types: [labeled]
    branches: [main]
permissions:
  contents: read
  actions: read
concurrency:
  group: events-production
  cancel-in-progress: false
jobs:
  recover:
    if: github.repository == 'kasstmaster/events' && github.actor == 'kasstmaster' && github.event.pull_request.head.repo.full_name == 'kasstmaster/events' && github.event.pull_request.head.ref == 'recovery/activate-approved-worker' && github.event.label.name == 'restore-approved-worker-2445780c'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/checkout@v5
        with:
          ref: 925c25ad0f89b6deb85838ae36f13d168444b1d0
          path: .approved-application
          persist-credentials: false
      - name: Install verification tools before accessing production
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Validate guarded rollback behavior
        run: node --test scripts/approved-worker-recovery.test.mjs
      - name: Fresh production preflight and recovery checkpoint
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACTIONS_GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/approved-worker-recovery.mjs preflight
      - name: Retain checkpoint before any production operation
        uses: actions/upload-artifact@v6
        with:
          name: approved-worker-checkpoint-${{ github.run_id }}-${{ github.run_attempt }}
          path: recovery/checkpoint.json
          if-no-files-found: error
          retention-days: 29
      - name: Activate original Worker without force or database restore
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACTIONS_GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/approved-worker-recovery.mjs activate
      - name: Verify actual active Worker and preserved production state
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACTIONS_GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/approved-worker-recovery.mjs verify
      - name: Compare live assets with the exact approved application
        run: node scripts/approved-worker-assets.mjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: approved-worker-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: recovery/
          if-no-files-found: error
          retention-days: 29
