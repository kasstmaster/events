name: Format staged Firebase host branch (temporary)
on:
  push:
    branches: [feat/firebase-host-only-auth]
permissions:
  contents: write
jobs:
  format-only:
    if: github.repository == 'kasstmaster/events' && github.ref == 'refs/heads/feat/firebase-host-only-auth'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Format only reviewed Firebase host files
        run: npx prettier --write server/firebase-host.js server/host-auth-api.js server/host-signup.js server/handler.js public/host-auth-ui.js test/firebase-host.test.js docs/firebase-host-auth.md package.json
      - name: Commit formatting only on this feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- server/firebase-host.js server/host-auth-api.js server/host-signup.js server/handler.js public/host-auth-ui.js test/firebase-host.test.js docs/firebase-host-auth.md package.json
          if ! git diff --cached --quiet; then
            git commit -m "Format staged Firebase host source"
            git push origin HEAD:feat/firebase-host-only-auth
          fi
