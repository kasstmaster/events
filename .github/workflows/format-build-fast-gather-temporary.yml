name: Build Gather startup optimization (temporary)
on:
  push:
    branches: [perf/fast-gather-startup-20261127]
permissions:
  contents: write
jobs:
  build:
    if: github.repository == 'kasstmaster/events' && github.ref == 'refs/heads/perf/fast-gather-startup-20261127'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format, build and record reviewed browser asset
        run: |
          npx prettier --write client/app.js
          npm run build:browser
          node --input-type=module -e 'import fs from "node:fs";import {createHash} from "node:crypto";const p=".github/release/approved-application.json";const j=JSON.parse(fs.readFileSync(p,"utf8"));j.appearance["public/app.js"]=createHash("sha256").update(fs.readFileSync("public/app.js")).digest("hex");fs.writeFileSync(p,JSON.stringify(j,null,2)+"\n");'
      - name: Commit reviewed source and generated output to feature branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- client/app.js public/app.js .github/release/approved-application.json
          if ! git diff --cached --quiet; then
            git commit -m "Build reviewed startup and archived events UI"
            git push origin HEAD:perf/fast-gather-startup-20261127
          fi
