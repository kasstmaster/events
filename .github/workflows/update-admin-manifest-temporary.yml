name: Update Gather admin appearance release manifest (temporary)
on:
  push:
    branches: [fix/admin-actions-home-overflow]
permissions:
  contents: write
jobs:
  record:
    if: github.repository == 'kasstmaster/events' && github.ref == 'refs/heads/fix/admin-actions-home-overflow'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Record new reviewed UI hash in release manifest
        run: |
          node --input-type=module -e 'import fs from "node:fs"; import {createHash} from "node:crypto"; const p=".github/release/approved-application.json"; const data=JSON.parse(fs.readFileSync(p,"utf8")); data.appearance["public/app.js"]=createHash("sha256").update(fs.readFileSync("public/app.js")).digest("hex"); fs.writeFileSync(p,JSON.stringify(data,null,2)+"\n");'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/release/approved-application.json
          if ! git diff --cached --quiet; then
            git commit -m "Update reviewed administrator Home toolbar appearance hash"
            git push origin HEAD:fix/admin-actions-home-overflow
          fi
