name: Read-only restored Worker verification
on:
  pull_request:
    types: [labeled]
    branches: [main]
permissions:
  contents: read
  actions: read
jobs:
  verify:
    if: github.repository == 'kasstmaster/events' && github.actor == 'kasstmaster' && github.event.pull_request.number == 73 && github.event.pull_request.head.repo.full_name == 'kasstmaster/events' && github.event.pull_request.head.ref == 'recovery/activate-approved-worker' && github.event.label.name == 'verify-restored-worker-2445780c'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          ref: 925c25ad0f89b6deb85838ae36f13d168444b1d0
          path: .approved-application
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v7
        with:
          name: approved-worker-checkpoint-42990249303-1
          path: recovery
          repository: kasstmaster/events
          run-id: 42990249303
          github-token: ${{ github.token }}
      - name: Recheck preserved production state (GET only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACTIONS_GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/approved-worker-recovery.mjs verify
      - name: Recheck public assets and phone/desktop rendering
        run: node scripts/approved-worker-assets.mjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: restored-worker-live-verification-${{ github.run_id }}
          path: recovery/
          if-no-files-found: error
          retention-days: 29
