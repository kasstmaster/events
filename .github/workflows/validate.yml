name: Validate shared event platform
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    # Playwright 1.58.2 supports 24.04; ubuntu-latest may select unsupported 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Original phone workflow
        run: node test/mobile.cjs
      - name: Household phone and desktop routing
        run: node test/domains-mobile.js
      - name: Shared editor browser checks
        timeout-minutes: 3
        run: node test/features-mobile.js
      - name: Cloudflare runtime checks
        if: ${{ !cancelled() }}
        run: npm run test:cloudflare
      - name: Browser failure screenshots
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-screenshots
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
