name: Temporary pre-67 recovery inspection
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: events-production
  cancel-in-progress: false
jobs:
  inspect:
    if: github.repository == 'kasstmaster/events' && github.event.pull_request.head.repo.full_name == 'kasstmaster/events' && github.event.pull_request.head.ref == 'recovery/pre67-inspection'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Disable unsafe release workflow and read Events inventory
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/pre67-inspection.mjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: pre67-inspection-${{ github.run_id }}
          path: recovery/pre67-inspection.json
          if-no-files-found: error
          retention-days: 29
