name: Generate and test cold-start application optimization
on:
  push:
    branches:
      - fix/gather-cold-start-firebase-token-dedupe
permissions:
  contents: write
jobs:
  rebuild:
    if: github.repository == 'kasstmaster/events' && github.actor == 'kasstmaster'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/gather-cold-start-firebase-token-dedupe
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Generate reviewed deterministic app entries and manifest
        run: |
          node -e 'const fs=require("fs"); console.log("Before bytes",fs.statSync("public/app.js").size)'
          npm run build:browser
          node -e 'const fs=require("fs"); console.log("After bytes",fs.statSync("public/app.js").size)'
          node scripts/automatic-events-release.mjs manifest
          npm run format:check
          npm test
          npm run test:cloudflare
      - name: Commit only verified browser build products
        run: |
          git add public/app.js .github/release/approved-application.json scripts/build-browser.mjs
          git diff --cached --quiet && exit 0
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build: regenerate smaller reviewed Gather entry and asset manifest'
          git push origin HEAD:fix/gather-cold-start-firebase-token-dedupe
